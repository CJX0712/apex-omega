name: CI · 可证门禁

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # 甲类门禁：ISA 完整性 + AXIOM 386 项数学不变量 + 参照采样器自检
  # 不需要模型、不需要 GPU、不需要网络 —— 任何环境可复现
  gates-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: 甲类门禁（模型无关）
        run: node test/run.js --json > gates-core.json; cat gates-core.json
      - name: 断言全绿
        run: |
          node -e "
          const r = require('./gates-core.json');
          const skipped = r.results.filter(x => x.skipped).length;
          const eff = r.results.filter(x => !x.skipped);
          const passed = eff.filter(x => x.pass).length;
          console.log('passed', passed, '/', eff.length, '| skipped', skipped);
          if (passed !== eff.length) { console.error('GATES FAILED'); process.exit(1); }
          if (eff.length < 11) { console.error('expected >= 11 core gates'); process.exit(1); }
          "
      - uses: actions/upload-artifact@v4
        with:
          name: gates-core-report
          path: gates-core.json

  # 乙类门禁：与 llama.cpp 生产核对拍（需下载 GGUF 模型）
  gates-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: 下载 Qwen2.5-0.5B-Instruct GGUF（469 MB）
        run: |
          mkdir -p models
          curl -sSL -o models/qwen2.5-0.5b-q4_k_m.gguf \
            https://hf-mirror.com/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
          ls -la models/
      - name: 全量门禁（甲类 + 乙类）
        run: node test/run.js --json --rounds 40 > gates-full.json; cat gates-full.json
      - name: 断言 15/15 全绿
        run: |
          node -e "
          const r = require('./gates-full.json');
          const eff = r.results.filter(x => !x.skipped);
          const passed = eff.filter(x => x.pass).length;
          console.log('passed', passed, '/', eff.length);
          if (!r.allGreen) { console.error('GATES FAILED'); process.exit(1); }
          if (eff.length < 15) { console.error('expected >= 15 gates'); process.exit(1); }
          "
      - uses: actions/upload-artifact@v4
        with:
          name: gates-full-report
          path: gates-full.json
